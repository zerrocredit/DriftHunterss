<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Drift Hunters Unblocked</title>
  <meta name="description" content="Drift Hunters, Drift Hunters Unblocked">
  <meta property="og:image" content="drift-hunters.png" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader2019.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #gameContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
  <script>
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/drift-hunters.json",
      {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          }
        }
      }
    );
  </script>
</head>
<body>
  <div id="gameContainer"></div>
</body>
</html>
